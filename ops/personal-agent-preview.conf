# Include INSIDE the existing https://blackoutburst.com HTTPS server block only.
# Review against all installed locations before installing; nginx -t before reload.
location = /personal-agent-preview {
    access_log off;
    return 302 /personal-agent-preview/;
}
# Only the private raw-upload endpoint gets the larger body limit. All authorization stays in the app.
# Operator: inspect the installed virtual host, back up this include, nginx -t, then reload.
location = /personal-agent-preview/api/files {
    proxy_pass http://127.0.0.1:4318/api/files;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host 127.0.0.1:4318;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_intercept_errors off;
    proxy_request_buffering off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_body_timeout 120s;
    client_max_body_size 100m;
    access_log off;
}
# Owner companion actions (memory and personality edits send whole files): 2 MiB, enforced again by the app.
location = /personal-agent-preview/api/companion {
    proxy_pass http://127.0.0.1:4318/api/companion;
    proxy_set_header Host 127.0.0.1:4318;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_intercept_errors off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    client_max_body_size 2m;
    access_log off;
}
# Owner profile saves carry one picture (at most 192 KiB, base64 in JSON): 512 KiB, enforced again by the app (#53).
location = /personal-agent-preview/api/owner-profile {
    proxy_pass http://127.0.0.1:4318/api/owner-profile;
    proxy_set_header Host 127.0.0.1:4318;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_intercept_errors off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    client_max_body_size 512k;
    access_log off;
}
location ^~ /personal-agent-preview/ {
    proxy_pass http://127.0.0.1:4318/;
    proxy_set_header Host 127.0.0.1:4318;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_intercept_errors off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    # Conversation requests carry messages of up to 8,000 characters (server limit 64 KiB).
    client_max_body_size 64k;
    # Disable access logs for this prefix. Inherited error logs need separate review.
    access_log off;
}
# The scheduler/file brokers are loopback-only (provider MCP child -> local service); never proxy them.
location ^~ /personal-agent-preview/internal/ {
    access_log off;
    return 404;
}
